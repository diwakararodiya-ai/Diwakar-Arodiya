<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle ring border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.3" />

  <!-- Glowing Sun in Background -->
  <g filter="url(#shadow)">
    <circle cx="340" cy="180" r="70" fill="url(#sunGrad)" />
    <!-- Sun Rays -->
    <path d="M 340 85 L 340 65 M 340 275 L 340 295 M 245 180 L 225 180 M 435 180 L 455 180 M 273 113 L 258 98 M 407 247 L 422 262 M 273 247 L 258 262 M 407 113 L 422 98" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
  </g>

  <!-- Rain Cloud -->
  <g filter="url(#shadow)">
    <path d="M 170 250 C 170 205 205 170 250 170 C 285 170 315 192 325 223 C 333 220 341 218 350 218 C 380 218 405 242 405 272 C 405 302 380 326 350 326 L 180 326 C 145 326 120 300 120 268 C 120 238 142 215 170 212" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- Raindrops -->
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round">
    <line x1="170" y1="345" x2="160" y2="370" />
    <line x1="210" y1="345" x2="200" y2="370" />
    <line x1="250" y1="345" x2="240" y2="370" />
    <line x1="290" y1="345" x2="280" y2="370" />
  </g>

  <!-- Golden Wheat / Sprout Sheaf -->
  <g filter="url(#shadow)" transform="translate(140, 200)">
    <!-- Central Stem -->
    <path d="M 120 230 C 120 160 110 80 110 30" stroke="#facc15" stroke-width="10" stroke-linecap="round" fill="none" />
    
    <!-- Left Grains -->
    <ellipse cx="85" cy="180" rx="20" ry="12" fill="url(#goldGrad)" transform="rotate(-35, 85, 180)" />
    <ellipse cx="75" cy="130" rx="20" ry="12" fill="url(#goldGrad)" transform="rotate(-35, 75, 130)" />
    <ellipse cx="80" cy="80" rx="18" ry="10" fill="url(#goldGrad)" transform="rotate(-35, 80, 80)" />

    <!-- Right Grains -->
    <ellipse cx="145" cy="160" rx="20" ry="12" fill="url(#goldGrad)" transform="rotate(35, 145, 160)" />
    <ellipse cx="140" cy="110" rx="20" ry="12" fill="url(#goldGrad)" transform="rotate(35, 140, 110)" />
    <ellipse cx="135" cy="65" rx="18" ry="10" fill="url(#goldGrad)" transform="rotate(35, 135, 65)" />

    <!-- Top Crown Grain -->
    <ellipse cx="110" cy="30" rx="22" ry="12" fill="url(#goldGrad)" transform="rotate(90, 110, 30)" />

    <!-- Fresh Green Leaves at base -->
    <path d="M 120 230 C 90 220 50 200 40 160 C 50 185 80 205 120 215 Z" fill="url(#leafGrad)" />
    <path d="M 120 230 C 150 220 190 200 200 160 C 190 185 160 205 120 215 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Small Android Robot badge in bottom-right corner -->
  <g transform="translate(385, 385)">
    <circle cx="45" cy="45" r="40" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#shadow)" />
    <!-- Android Robot Face -->
    <path d="M 25 45 C 25 32 34 22 45 22 C 56 22 65 32 65 45 Z" fill="#ffffff" />
    <circle cx="37" cy="35" r="3" fill="#047857" />
    <circle cx="53" cy="35" r="3" fill="#047857" />
    <!-- Antennas -->
    <line x1="33" y1="24" x2="27" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="57" y1="24" x2="63" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
