<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="kcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#031a14" />
    </linearGradient>

    <!-- Golden Sun Gradient -->
    <radialGradient id="kcSun" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>

    <!-- Primary Caring Leaf (Emerald to Mint) -->
    <linearGradient id="kcLeafLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Rising Sprout (Forest to Lime-Emerald) -->
    <linearGradient id="kcLeafRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#kcBg)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Minimal Icon: Sun / Vitality Orb -->
  <circle cx="308" cy="160" r="66" fill="#facc15" fill-opacity="0.18" />
  <circle cx="308" cy="160" r="54" fill="url(#kcSun)" />

  <!-- Minimal Icon: Caring Left Leaf (Growth, Agriculture & Shelter) -->
  <path
    d="M 256 424 C 164 412 108 336 108 244 C 108 148 180 84 252 56 C 224 128 228 204 252 276 C 262 308 266 364 256 424 Z"
    fill="url(#kcLeafLeft)"
  />

  <!-- Minimal Icon: Rising Right Sprout (Vitality & Care) -->
  <path
    d="M 256 424 C 296 368 364 316 392 252 C 420 188 400 128 364 92 C 380 144 372 204 328 264 C 296 308 276 360 256 424 Z"
    fill="url(#kcLeafRight)"
  />

  <!-- Minimal Icon: Delicate Center Stem Accent -->
  <path
    d="M 256 424 C 258 360 268 300 284 252"
    stroke="#a7f3d0"
    stroke-width="6"
    stroke-linecap="round"
    stroke-opacity="0.45"
  />
</svg>
